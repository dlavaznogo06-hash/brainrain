
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(ellipse at top left, #102C65 0%, transparent 45%),
                linear-gradient(135deg, #080D1B, #050918, #080D1B);
            font-family: Arial, sans-serif;
        }

        /* Логотип */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 85px;
            height: auto;
            object-fit: contain;
            z-index: 5;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;
            top: 115px;
            left: 25px;
            width: 35px;
            height: 35px;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            z-index: 20;
            transition: opacity 0.15s ease;
        }

        .menu-button span {
            width: 24px;
            height: 2px;
            background: white;
            border-radius: 10px;
        }

        .menu-button.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Выдвижное меню */
        .side-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 100vh;
            height: 100dvh;
            min-height: 300px;
            background: linear-gradient(160deg, #10264D, #08152E);
            border: none;
            border-radius: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            transform: translateX(-105%);
            transition: transform 0.22s ease;
            z-index: 10;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        /* Верхняя часть меню */
        .menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 35px;
            gap: 5px;
        }

        /* Аватарка и ник */
        .user-info {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            background: #254875;
            flex-shrink: 0;
        }

        .user-name {
            color: #D5E8FF;
            font-size: 12px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Стрелка закрытия */
        .close-menu {
            width: 25px;
            height: 30px;
            border: none;
            background: transparent;
            color: #A9CEFF;
            font-size: 25px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Пункты меню */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #A9CEFF;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.1px;
            text-decoration: none;
            padding: 8px 5px;
            white-space: nowrap;
            background: rgba(255,255,255,0.035);
        }

        .menu-icon {
            font-size: 16px;
            width: 19px;
            text-align: center;
        }

        .menu-item:active {
            background: rgba(75, 150, 255, 0.2);
        }
    </style>
</head>

<body>

    <img src="logo2.png" class="logo" alt="BrainRain">

    <!-- Кнопка открытия -->
    <button class="menu-button" id="menuButton">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Боковое меню -->
    <nav class="side-menu" id="sideMenu">

        <div class="menu-header">

            <div class="user-info">
                <img
                    src=""
                    class="user-avatar"
                    id="userAvatar"
                    alt="Аватар"
                >

                <span class="user-name" id="userName">
                    Игрок
                </span>
            </div>

            <button class="close-menu" id="closeMenu">
                ←
            </button>

        </div>

        <a class="menu-item" href="#">
            <span class="menu-icon">↗</span>
            Upgrade
        </a>

        <a class="menu-item" href="#">
            <span class="menu-icon">📦</span>
            Case
        </a>

        <a class="menu-item" href="#">
            <span class="menu-icon">👤</span>
            Profile
        </a>

    </nav>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");
        const closeMenu = document.getElementById("closeMenu");

        // Открытие меню
        menuButton.addEventListener("click", () => {
            sideMenu.classList.add("open");
            menuButton.classList.add("hidden");
        });

        // Закрытие меню
        function hideMenu() {
            sideMenu.classList.remove("open");
            menuButton.classList.remove("hidden");
        }

        closeMenu.addEventListener("click", hideMenu);

        // Данные пользователя Telegram
        const user = tg.initDataUnsafe?.user;

        if (user) {
            const userName = document.getElementById("userName");
            const userAvatar = document.getElementById("userAvatar");

            userName.textContent =
                user.username ? "@" + user.username :
                user.first_name || "Игрок";

            if (user.photo_url) {
                userAvatar.src = user.photo_url;
            } else {
                userAvatar.style.display = "none";
            }
        }
    </script>

</body>
</html>
