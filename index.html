
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(ellipse at top left, #102C65 0%, transparent 45%),
                linear-gradient(135deg, #080D1B, #050918, #080D1B);
            font-family: Arial, sans-serif;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 85px;
            height: auto;
            object-fit: contain;
            z-index: 5;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;
            top: 115px;
            left: 20px;
            width: 85px;
            height: 85px;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 16px;
            background: rgba(12, 25, 52, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            z-index: 20;
        }

        .menu-button span {
            width: 38px;
            height: 4px;
            background: white;
            border-radius: 10px;
        }

        /* Выдвижная панель */
        .side-menu {
            position: absolute;
            top: 110px;
            left: 0;
            width: 50%;
            height: 65vh;
            min-height: 300px;
            background: linear-gradient(160deg, #10264D, #08152E);
            border: 1px solid rgba(255,255,255,0.65);
            border-left: none;
            border-radius: 0 20px 20px 0;
            padding: 115px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            transform: translateX(-105%);
            transition: transform 0.35s ease;
            z-index: 10;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .menu-item {
            color: white;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-decoration: none;
            padding: 12px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
        }
    </style>
</head>

<body>

    <img src="logo.png" class="logo" alt="BrainRain">

    <button class="menu-button" id="menuButton">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="side-menu" id="sideMenu">
        <a class="menu-item" href="#">Upgrade</a>
        <a class="menu-item" href="#">Case</a>
        <a class="menu-item" href="#">Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");

        menuButton.addEventListener("click", () => {
            sideMenu.classList.toggle("open");
        });
    </script>

</body>
</html>
