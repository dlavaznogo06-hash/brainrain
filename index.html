
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainRain 💧</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border-radius: 0 !important;
    font-family: 'Pixelify Sans', sans-serif;
}

button, input {
    font-family: inherit;
}

body {
    background: radial-gradient(circle at top, #14264a 0%, #080d1b 55%);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 15px;
    position: relative;
    z-index: 5;
}

.menu-button {
    border: none;
    background: #172746;
    color: white;
    font-size: 25px;
    width: 42px;
    height: 42px;
    cursor: pointer;
}

.logo {
    width: 145px;
    height: 55px;
    object-fit: contain;
}

.header-balance {
    margin-left: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 12px;
    min-height: 42px;
    background: #1b3156;
    border: 1px solid #35527d;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.header-balance .coin-icon {
    width: 24px;
    height: 24px;
    flex: 0 0 24px;
}

.balance-number {
    color: #fff;
}

.menu {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    background: #101c35;
    z-index: 20;
    padding: 25px 18px;
    transition: 0.25s;
    box-shadow: 10px 0 35px #0008;
}

.menu.active {
    left: 0;
}

.menu-close {
    float: right;
    background: none;
    border: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

.profile-mini {
    margin: 45px 0 30px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.profile-mini > img:not(.coin-icon) {
    width: 48px;
    height: 48px;
    background: #26395e;
    object-fit: cover;
}

.menu-user-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.menu-name {
    font-weight: bold;
    overflow-wrap: anywhere;
    color: white;
}

.menu-balance {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    width: fit-content;
    padding: 6px 10px;
    background: #1b3156;
    border: 1px solid #35527d;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.menu-balance .coin-icon {
    width: 21px;
    height: 21px;
    flex: 0 0 21px;
}

.menu-item {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    background: #1b2d50;
    color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.menu-item:hover {
    background: #294577;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 15;
}

.overlay.active {
    display: block;
}

main {
    padding: 12px 0 40px;
}

.page-title {
    font-size: 25px;
    font-weight: 900;
    margin: 15px 18px 20px;
}

.case-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 13px;
    padding: 5px 14px 20px;
    width: 100%;
}

.case-card {
    width: 100%;
    min-width: 0;
    background: linear-gradient(145deg, #1b3156, #101b32);
    border: 1px solid #2b4772;
    padding: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.case-card:active {
    transform: scale(0.97);
}

.case-card > img {
    width: 100%;
    height: clamp(105px, 28vw, 165px);
    object-fit: contain;
}

.case-card h3 {
    font-size: clamp(12px, 3.2vw, 16px);
    margin: 8px 0;
    min-height: 36px;
    overflow-wrap: anywhere;
}

.price {
    color: #ffd45c;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.coin-icon {
    display: inline-block;
    width: 19px;
    height: 19px;
    object-fit: contain;
    vertical-align: middle;
    flex: 0 0 19px;
}

.case-page {
    display: none;
    padding: 0 16px 35px;
}

.back-button {
    background: #1b2d50;
    color: white;
    border: 1px solid #35527d;
    padding: 11px 17px;
    font-size: 15px;
    margin: 5px 0 18px;
    cursor: pointer;
}

.case-cover {
    display: block;
    width: 190px;
    height: 165px;
    object-fit: contain;
    margin: 0 auto 10px;
}

.case-name {
    text-align: center;
    font-size: 23px;
    margin: 10px 0;
}

.case-price {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    color: #ffd45c;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 20px;
}

.roulette-window {
    width: 100%;
    overflow: hidden;
    height: 115px;
    background: #0d172b;
    border: 2px solid #29436b;
    position: relative;
    margin: 15px 0 18px;
}

.roulette-window::before {
    content: "";
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #ffd45c;
    box-shadow: 0 0 10px #ffd45c;
    pointer-events: none;
}

.roulette-track {
    display: flex;
    gap: 9px;
    height: 100%;
    align-items: center;
    width: max-content;
    will-change: transform;
}

.roulette-item {
    width: 112px;
    height: 88px;
    flex: 0 0 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #172c4c;
    border: 1px solid #3974a9;
    overflow: hidden;
}

.roulette-item img {
    width: 85px;
    height: 75px;
    object-fit: contain;
}

.open-button {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 30px;
    padding: 15px;
    border: none;
    background: linear-gradient(90deg, #2478ed, #42a5ff);
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 20px #1678ed55;
}

.open-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.items-title {
    font-size: 19px;
    margin: 20px 0 13px;
}

.items-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.item-card {
    background: #142440;
    border: 1px solid #2a4770;
    padding: 10px;
    min-width: 0;
}

.item-card > img {
    width: 100%;
    height: 105px;
    object-fit: contain;
}

.item-card h4 {
    font-size: 13px;
    min-height: 30px;
    margin: 6px 0;
}

.item-price {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: #ffd45c;
    font-weight: bold;
}

.rarity-blue {
    border-color: #299bdc;
    box-shadow: inset 0 0 12px #1689d322;
}

.rarity-purple {
    border-color: #a45bff;
    box-shadow: inset 0 0 12px #a45bff33;
}

.rarity-red {
    border-color: #ff4545;
    box-shadow: inset 0 0 12px #ff303033;
}

.rarity-gold {
    border-color: #ffd45c;
    box-shadow: inset 0 0 12px #ffd45c33;
}

.profile-page {
    display: none;
    padding: 0 16px 35px;
}

.profile-card {
    width: 100%;
    min-height: 20vh;
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 28px);
    padding: clamp(14px, 3vw, 26px);
    background: linear-gradient(135deg, #1b3156, #12213d);
    border: 1px solid #35527d;
    box-shadow: 0 8px 25px #0003;
}

.profile-avatar {
    width: clamp(75px, 18vw, 145px);
    height: clamp(75px, 18vw, 145px);
    flex: 0 0 auto;
    object-fit: cover;
    background: #26395e;
    border: 3px solid #45658f;
    box-shadow: 0 0 18px #0005;
}

.profile-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
}

.profile-nickname {
    font-size: clamp(18px, 4vw, 30px);
    font-weight: 900;
    overflow-wrap: anywhere;
    line-height: 1.2;
    color: white;
}

.profile-label {
    color: #91a9cc;
    font-size: clamp(12px, 2.5vw, 15px);
}

.profile-username {
    color: #c5d7f3;
    font-size: clamp(13px, 2.8vw, 17px);
    overflow-wrap: anywhere;
}

.profile-balance {
    display: flex;
    align-items: center;
    gap: 8px;
    width: fit-content;
    padding: 8px 12px;
    background: #1b3156;
    border: 1px solid #35527d;
    color: white;
    font-size: clamp(17px, 3.5vw, 22px);
    font-weight: bold;
    margin-top: 5px;
}

.profile-balance .coin-icon {
    width: 23px;
    height: 23px;
    flex: 0 0 23px;
}

.profile-balance-label {
    color: #fff;
    font-size: 14px;
    font-weight: normal;
}

/* ПРОМОКОД В ПРОФИЛЕ */

.promo-card {
    background: linear-gradient(135deg, #1b3156, #12213d);
    border: 1px solid #35527d;
    padding: 22px;
    text-align: center;
    margin-top: 22px;
    box-shadow: 0 8px 25px #0003;
}

.promo-description {
    color: #c5d7f3;
    margin-bottom: 18px;
    line-height: 1.5;
}

#promoInput {
    display: block;
    width: 100%;
    padding: 15px;
    border: 1px solid #35527d;
    background: #0d172b;
    color: white;
    font-size: 18px;
    text-align: center;
    outline: none;
    margin-bottom: 15px;
    text-transform: uppercase;
}

#promoInput::placeholder {
    color: #8295b5;
}

#promoMessage {
    min-height: 22px;
    margin-top: 12px;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.hidden {
    display: none !important;
}

@media (min-width: 600px) {
    .case-list {
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        padding-left: 20px;
        padding-right: 20px;
    }

    .case-card {
        padding: 15px;
    }

    .case-card > img {
        height: 180px;
    }

    .case-card h3 {
        font-size: 16px;
    }

    .items-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .case-page {
        max-width: 750px;
        margin: auto;
    }

    .profile-page {
        max-width: 900px;
        margin: auto;
    }
}

@media (min-width: 1000px) {
    .case-list {
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 22px;
        padding-left: 28px;
        padding-right: 28px;
    }

    .case-card > img {
        height: 210px;
    }
}
</style>
</head>

<body>

<header>
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <img class="logo" src="logo2.png" alt="BrainRain">

    <div class="header-balance">
        <span class="balance-number" id="headerBalance">0</span>
        <img class="coin-icon" src="coin.png" alt="Coin">
    </div>
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="menu" id="menu">
    <button class="menu-close" onclick="toggleMenu()">×</button>

    <div class="profile-mini">
        <img id="userPhoto" src="logo2.png" alt="Аватар">

        <div class="menu-user-info">
            <div class="menu-name" id="userName">Игрок</div>

            <div class="menu-balance">
                <span class="balance-number" id="menuBalance">0</span>
                <img class="coin-icon" src="coin.png" alt="Coin">
            </div>
        </div>
    </div>

    <button class="menu-item" onclick="showHome()">🎁 Case</button>
    <button class="menu-item" onclick="showComingSoon('Upgrade')">⚡ Upgrade</button>
    <button class="menu-item" onclick="showProfile()">👤 Profile</button>
</nav>

<main>
    <section id="homePage">
        <h1 class="page-title">Кейсы 💧</h1>

        <div class="case-list">
            <div class="case-card" onclick="showCase('sea')">
                <img src="sea-case.png" alt="Морской кейс">
                <h3>Морской кейс 🌊</h3>
                <div class="price">
                    99 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>

            <div class="case-card" onclick="showCase('impact')">
                <img src="impact-case.png" alt="Ударный кейс">
                <h3>Ударный кейс 👊</h3>
                <div class="price">
                    12 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>

            <div class="case-card" onclick="showCase('all')">
                <img src="all-or-nothing.png" alt="Всё или ничего">
                <h3>ВСЁ ИЛИ НИЧЕГО 🎲</h3>
                <div class="price">
                    499 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>
        </div>
    </section>

    <section class="case-page" id="casePage">
        <button class="back-button" onclick="showHome()">← Назад</button>

        <img class="case-cover" id="detailImage" src="" alt="Кейс">
        <h2 class="case-name" id="detailName"></h2>
        <div class="case-price" id="detailPrice"></div>

        <div class="roulette-window">
            <div class="roulette-track" id="seaRoulette"></div>
            <div class="roulette-track hidden" id="impactRoulette"></div>
            <div class="roulette-track hidden" id="allRoulette"></div>
        </div>

        <button class="open-button" onclick="openCase()">ОТКРЫТЬ</button>

        <h3 class="items-title">Содержимое кейса</h3>
        <div class="items-grid" id="itemsGrid"></div>
    </section>

    <section class="profile-page" id="profilePage">
        <div class="profile-card">
            <img
                class="profile-avatar"
                id="profilePhoto"
                src="logo2.png"
                alt="Аватар игрока"
            >

            <div class="profile-info">
                <div class="profile-label">ПРОФИЛЬ ИГРОКА</div>
                <div class="profile-nickname" id="profileName">Игрок</div>
                <div class="profile-username" id="profileUsername">@player</div>

                <div class="profile-balance">
                    <span class="balance-number" id="profileBalance">0</span>
                    <img class="coin-icon" src="coin.png" alt="Coin">
                    <span class="profile-balance-label">Coin</span>
                </div>
            </div>
        </div>

        <!-- ПРОМОКОД ТЕПЕРЬ ВНИЗУ ПРОФИЛЯ -->
        <div class="promo-card">
            <h2 class="items-title">ПРОМОКОД</h2>

            <p class="promo-description">
                Введи промокод и получи Coin! 💧
            </p>

            <input
                id="promoInput"
                type="text"
                maxlength="10"
                placeholder="ВВЕДИ ПРОМОКОД"
                autocomplete="off"
            >

            <button
                class="open-button"
                id="promoButton"
                onclick="redeemPromo()"
            >
                АКТИВИРОВАТЬ
            </button>

            <p id="promoMessage"></p>
        </div>
    </section>
</main>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

// Адрес сервера промокодов
const API_URL = "https://brainrain-promo-2-433678.subhub.tr";

let playerBalance = 0;

// ==========================
// БАЛАНС
// ==========================

function updateBalance() {
    const formattedBalance = playerBalance.toLocaleString("ru-RU");

    document.getElementById("headerBalance").textContent = formattedBalance;
    document.getElementById("menuBalance").textContent = formattedBalance;
    document.getElementById("profileBalance").textContent = formattedBalance;
}

async function loadBalance() {
    try {
        if (!tg.initData) {
            console.warn("Игра открыта не через Telegram.");
            return;
        }

        const response = await fetch(API_URL + "/api/balance", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                initData: tg.initData
            })
        });

        const data = await response.json();

        if (data.ok) {
            playerBalance = data.balance;
            updateBalance();
        } else {
            console.error("Не удалось загрузить баланс:", data.error);
        }

    } catch (error) {
        console.error("Ошибка загрузки баланса:", error);
    }
}

// ==========================
// АКТИВАЦИЯ ПРОМОКОДА
// ==========================

async function redeemPromo() {
    const input = document.getElementById("promoInput");
    const button = document.getElementById("promoButton");
    const message = document.getElementById("promoMessage");

    const code = input.value.trim().toUpperCase();

    if (!code) {
        message.textContent = "❌ Введи промокод!";
        return;
    }

    if (!/^[A-Z0-9]{1,10}$/.test(code)) {
        message.textContent = "❌ Неверный формат промокода.";
        return;
    }

    if (!tg.initData) {
        message.textContent = "❌ Открой игру через Telegram!";
        return;
    }

    button.disabled = true;
    message.textContent = "⏳ Проверяем промокод...";

    try {
        const response = await fetch(API_URL + "/api/redeem", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                initData: tg.initData,
                code: code
            })
        });

        const data = await response.json();

        if (data.ok) {
            playerBalance = data.balance;
            updateBalance();

            message.textContent =
                "✅ " + data.message +
                ". Баланс: " + data.balance + " Coin";

            input.value = "";

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred("success");
            }

        } else {
            message.textContent = "❌ " + data.error;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred("error");
            }
        }

    } catch (error) {
        console.error("Ошибка активации:", error);
        message.textContent =
            "❌ Не удалось связаться с сервером. Попробуй позже.";
    }

    button.disabled = false;
}

// ==========================
// ДАННЫЕ ИГРОКА
// ==========================

if (user) {
    const displayName = user.first_name || "Игрок";

    const fullName = [user.first_name, user.last_name]
        .filter(Boolean)
        .join(" ");

    const nickname = user.username
        ? "@" + user.username
        : fullName || "Игрок";

    document.getElementById("userName").textContent = nickname;
    document.getElementById("profileName").textContent = displayName;
    document.getElementById("profileUsername").textContent = nickname;

    if (user.photo_url) {
        document.getElementById("userPhoto").src = user.photo_url;
        document.getElementById("profilePhoto").src = user.photo_url;
    }
}

// ==========================
// КЕЙСЫ
// ==========================

const seaItems = [
    { name: "Los Primos", image: "los-primos.png", price: 49, rarity: "rarity-blue" },
    { name: "Evildon", image: "evildon.png", price: 65, rarity: "rarity-blue" },
    { name: "Tralaledon", image: "tralaledon.png", price: 99, rarity: "rarity-blue" },
    { name: "Capitano Moby", image: "capitano-moby.png", price: 130, rarity: "rarity-purple" },
    { name: "Jelly Moby", image: "jelly-moby.png", price: 1150, rarity: "rarity-purple" },
    { name: "Kraken", image: "kraken.png", price: 2300, rarity: "rarity-red" }
];

const impactItems = [
    { name: "Candy Slap", image: "candy-slap.png", price: 7, rarity: "rarity-blue" },
    { name: "Divine Slap", image: "divine-slap.png", price: 9, rarity: "rarity-blue" },
    { name: "YinYang Slap", image: "yinyang-slap.png", price: 9, rarity: "rarity-blue" },
    { name: "Cursed Slap", image: "cursed-slap.png", price: 12, rarity: "rarity-blue" },
    { name: "Radioactive Slap", image: "radioactive-slap.png", price: 13, rarity: "rarity-blue" },
    { name: "Lava Slap", image: "lava-slap.png", price: 13, rarity: "rarity-blue" },
    { name: "Rainbow Slap", image: "rainbow-slap.png", price: 20, rarity: "rarity-purple" },
    { name: "Bloodmoon Slap", image: "bloodmoon-slap.png", price: 30, rarity: "rarity-purple" },
    { name: "Rainbow Hammer", image: "rainbow-hammer.png", price: 500, rarity: "rarity-red" },
    { name: "Bloodmoon Hammer", image: "bloodmoon-hammer.png", price: 1100, rarity: "rarity-red" }
];

const allItems = [
    { name: "1 Coin", image: "coin.png", price: 1, rarity: "rarity-blue" },
    { name: "Dragon Caneloni", image: "dragon-caneloni.png", price: 950, rarity: "rarity-gold" }
];

const cases = {
    sea: {
        name: "Морской кейс 🌊",
        image: "sea-case.png",
        price: 99,
        items: seaItems,
        roulette: "seaRoulette"
    },
    impact: {
        name: "Ударный кейс 👊",
        image: "impact-case.png",
        price: 12,
        items: impactItems,
        roulette: "impactRoulette"
    },
    all: {

// ==========================
// РУЛЕТКИ
// ==========================

function shuffleItems(items) {
    const shuffled = [...items];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}

function createRoulette(elementId, items) {
    const track = document.getElementById(elementId);

    let position = 0;
    let lastTime = null;

    const itemWidth = 112;
    const gap = 9;
    const step = itemWidth + gap;
    const speed = 65;

    function addItem(item) {
        const card = document.createElement("div");
        card.className = "roulette-item " + item.rarity;

        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;

        card.appendChild(img);
        track.appendChild(card);
    }

    for (let i = 0; i < 8; i++) {
        const shuffled = shuffleItems(items);
        shuffled.forEach(item => addItem(item));
    }

    function animate(time) {
        if (lastTime === null) lastTime = time;

        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        position += speed * delta;

        while (position >= step) {
            track.appendChild(track.firstElementChild);
            position -= step;
        }

        track.style.transform = `translate3d(${-position}px, 0, 0)`;

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
}

createRoulette("seaRoulette", seaItems);
createRoulette("impactRoulette", impactItems);
createRoulette("allRoulette", allItems);
