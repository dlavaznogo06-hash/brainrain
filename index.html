
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(ellipse at top left, #102C65 0%, transparent 45%),
                linear-gradient(135deg, #080D1B, #050918, #080D1B);
            font-family: Arial, sans-serif;
        }

        /* Логотип */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 85px;
            height: auto;
            object-fit: contain;
            z-index: 5;
        }

        /* Полоски меню */
        .menu-button {
            position: absolute;
            top: 115px;
            left: 25px;
            width: 35px;
            height: 35px;
            border: none;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            z-index: 20;
        }

        .menu-button span {
            width: 24px;
            height: 2px;
            background: white;
            border-radius: 10px;
        }

        /* Выдвижное меню */
        .side-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 38%;
            height: 100vh;
            min-height: 300px;
            background: linear-gradient(160deg, #10264D, #08152E);
            border: none;
            border-radius: 0;
            padding: 160px 10px 20px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            transform: translateX(-105%);
            transition: transform 0.35s ease;
            z-index: 10;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        /* Пункты меню */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #A9CEFF;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1px;
            text-decoration: none;
            padding: 7px 5px;
            white-space: nowrap;
            background: rgba(255,255,255,0.035);
        }

        .menu-icon {
            font-size: 14px;
            width: 17px;
            text-align: center;
        }

        .menu-item:active {
            background: rgba(75, 150, 255, 0.2);
        }
    </style>
</head>

<body>

    <img src="logo2.png" class="logo" alt="BrainRain">

    <button class="menu-button" id="menuButton">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="side-menu" id="sideMenu">
        <a class="menu-item" href="#">
            <span class="menu-icon">↗</span>
            Upgrade
        </a>

        <a class="menu-item" href="#">
            <span class="menu-icon">📦</span>
            Case
        </a>

        <a class="menu-item" href="#">
            <span class="menu-icon">👤</span>
            Profile
        </a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");

        menuButton.addEventListener("click", () => {
            sideMenu.classList.toggle("open");
        });
    </script>

</body>
</html>
