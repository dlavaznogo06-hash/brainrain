
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(ellipse at top left, #102C65 0%, transparent 45%),
                linear-gradient(135deg, #080D1B, #050918, #080D1B);
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 85px;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <img src="logo.png" class="logo" alt="BrainRain">

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    </script>

</body>
</html>
