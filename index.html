
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainRain 💧</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: radial-gradient(circle at top, #14264a 0%, #080d1b 55%);
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

header {
    height: 75px;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 15px;
    position: relative;
    z-index: 5;
}

.menu-button {
    border: none;
    background: #172746;
    color: white;
    font-size: 25px;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    cursor: pointer;
}

.logo {
    width: 145px;
    height: 55px;
    object-fit: contain;
}

.menu {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100%;
    background: #101c35;
    z-index: 20;
    padding: 25px 18px;
    transition: 0.25s;
    box-shadow: 10px 0 35px #0008;
}

.menu.active {
    left: 0;
}

.menu-close {
    float: right;
    background: none;
    border: none;
    color: white;
    font-size: 27px;
    cursor: pointer;
}

.profile-mini {
    margin: 45px 0 30px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.profile-mini img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #26395e;
    object-fit: cover;
}

.menu-name {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.menu-item {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    background: #1b2d50;
    color: white;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
}

.menu-item:hover {
    background: #294577;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0009;
    z-index: 15;
}

.overlay.active {
    display: block;
}

main {
    padding: 12px 0 40px;
}

.page-title {
    font-size: 25px;
    font-weight: 900;
    margin: 15px 18px 20px;
}

.case-list {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    padding: 5px 18px 20px;
    scrollbar-width: none;
}

.case-list::-webkit-scrollbar {
    display: none;
}

.case-card {
    flex: 0 0 165px;
    background: linear-gradient(145deg, #1b3156, #101b32);
    border: 1px solid #2b4772;
    border-radius: 17px;
    padding: 12px;
    cursor: pointer;
    transition: 0.2s;
}

.case-card:active {
    transform: scale(0.97);
}

.case-card > img {
    width: 100%;
    height: 125px;
    object-fit: contain;
}

.case-card h3 {
    font-size: 14px;
    margin: 8px 0;
    min-height: 34px;
}

.price {
    color: #ffd45c;
    font-weight: bold;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 5px;
}

.coin-icon {
    display: inline-block;
    width: 19px;
    height: 19px;
    object-fit: contain;
    vertical-align: middle;
    flex: 0 0 19px;
}

.case-page {
    display: none;
    padding: 0 16px 35px;
}

.back-button {
    background: #1b2d50;
    color: white;
    border: 1px solid #35527d;
    border-radius: 10px;
    padding: 11px 17px;
    font-size: 15px;
    margin: 5px 0 18px;
    cursor: pointer;
}

.case-cover {
    display: block;
    width: 190px;
    height: 165px;
    object-fit: contain;
    margin: 0 auto 10px;
}

.case-name {
    text-align: center;
    font-size: 23px;
    margin: 10px 0;
}

.case-price {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    color: #ffd45c;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 20px;
}

.roulette-window {
    width: 100%;
    overflow: hidden;
    height: 115px;
    background: #0d172b;
    border: 2px solid #29436b;
    border-radius: 13px;
    position: relative;
    margin: 15px 0 18px;
}

.roulette-window::before {
    content: "";
    position: absolute;
    z-index: 2;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #ffd45c;
    box-shadow: 0 0 10px #ffd45c;
    pointer-events: none;
}

.roulette-track {
    display: flex;
    gap: 9px;
    height: 100%;
    align-items: center;
    width: max-content;
    will-change: transform;
}

.roulette-item {
    width: 112px;
    height: 88px;
    flex: 0 0 112px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #172c4c;
    border: 1px solid #3974a9;
    overflow: hidden;
}

.roulette-item img {
    width: 85px;
    height: 75px;
    object-fit: contain;
}

.open-button {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 0 auto 30px;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: linear-gradient(90deg, #2478ed, #42a5ff);
    color: white;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 5px 20px #1678ed55;
}

.items-title {
    font-size: 19px;
    margin: 20px 0 13px;
}

.items-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 11px;
}

.item-card {
    background: #142440;
    border: 1px solid #2a4770;
    border-radius: 13px;
    padding: 10px;
    min-width: 0;
}

.item-card > img {
    width: 100%;
    height: 105px;
    object-fit: contain;
}

.item-card h4 {
    font-size: 13px;
    min-height: 30px;
    margin: 6px 0;
}

.item-price {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: #ffd45c;
    font-weight: bold;
}

.rarity-blue {
    border-color: #299bdc;
    box-shadow: inset 0 0 12px #1689d322;
}

.rarity-purple {
    border-color: #a45bff;
    box-shadow: inset 0 0 12px #a45bff33;
}

.rarity-red {
    border-color: #ff4545;
    box-shadow: inset 0 0 12px #ff303033;
}

.rarity-gold {
    border-color: #ffd45c;
    box-shadow: inset 0 0 12px #ffd45c33;
}

.hidden {
    display: none !important;
}

@media (min-width: 600px) {
    .items-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .case-list {
        flex-wrap: wrap;
    }

    .case-page {
        max-width: 750px;
        margin: auto;
    }
}
</style>
</head>

<body>

<header>
    <button class="menu-button" onclick="toggleMenu()">☰</button>
    <img class="logo" src="logo2.png" alt="BrainRain">
</header>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<nav class="menu" id="menu">
    <button class="menu-close" onclick="toggleMenu()">×</button>

    <div class="profile-mini">
        <img id="userPhoto" src="logo2.png" alt="Аватар">
        <div class="menu-name" id="userName">Игрок</div>
    </div>

    <button class="menu-item" onclick="showHome()">🎁 Case</button>
    <button class="menu-item" onclick="showComingSoon('Upgrade')">⚡ Upgrade</button>
    <button class="menu-item" onclick="showComingSoon('Profile')">👤 Profile</button>
</nav>

<main>
    <section id="homePage">
        <h1 class="page-title">Кейсы 💧</h1>

        <div class="case-list">
            <div class="case-card" onclick="showCase('sea')">
                <img src="sea-case.png" alt="Морской кейс">
                <h3>Морской кейс 🌊</h3>
                <div class="price">
                    99 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>

            <div class="case-card" onclick="showCase('impact')">
                <img src="impact-case.png" alt="Ударный кейс">
                <h3>Ударный кейс 👊</h3>
                <div class="price">
                    12 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>

            <div class="case-card" onclick="showCase('all')">
                <img src="all-or-nothing.png" alt="Всё или ничего">
                <h3>ВСЁ ИЛИ НИЧЕГО 🎲</h3>
                <div class="price">
                    499 <img class="coin-icon" src="coin.png" alt="coin">
                </div>
            </div>
        </div>
    </section>

    <section class="case-page" id="casePage">
        <button class="back-button" onclick="showHome()">← Назад</button>

        <img class="case-cover" id="detailImage" src="" alt="Кейс">
        <h2 class="case-name" id="detailName"></h2>
        <div class="case-price" id="detailPrice"></div>

        <div class="roulette-window">
            <div class="roulette-track" id="seaRoulette"></div>
            <div class="roulette-track hidden" id="impactRoulette"></div>
            <div class="roulette-track hidden" id="allRoulette"></div>
        </div>

        <button class="open-button" onclick="openCase()">ОТКРЫТЬ</button>

        <h3 class="items-title">Содержимое кейса</h3>
        <div class="items-grid" id="itemsGrid"></div>
    </section>
</main>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
    document.getElementById("userName").textContent =
        user.username ? "@" + user.username :
        [user.first_name, user.last_name].filter(Boolean).join(" ");

    if (user.photo_url) {
        document.getElementById("userPhoto").src = user.photo_url;
    }
}

const seaItems = [
    { name: "Los Primos", image: "los-primos.png", price: 49, rarity: "rarity-blue" },
    { name: "Evildon", image: "evildon.png", price: 65, rarity: "rarity-blue" },
    { name: "Tralaledon", image: "tralaledon.png", price: 99, rarity: "rarity-blue" },
    { name: "Capitano Moby", image: "capitano-moby.png", price: 130, rarity: "rarity-purple" },
    { name: "Jelly Moby", image: "jelly-moby.png", price: 1150, rarity: "rarity-purple" },
    { name: "Kraken", image: "kraken.png", price: 2300, rarity: "rarity-red" }
];

const impactItems = [
    { name: "Candy Slap", image: "candy-slap.png", price: 7, rarity: "rarity-blue" },
    { name: "Divine Slap", image: "divine-slap.png", price: 9, rarity: "rarity-blue" },
    { name: "YinYang Slap", image: "yinyang-slap.png", price: 9, rarity: "rarity-blue" },
    { name: "Cursed Slap", image: "cursed-slap.png", price: 12, rarity: "rarity-blue" },
    { name: "Radioactive Slap", image: "radioactive-slap.png", price: 13, rarity: "rarity-blue" },
    { name: "Lava Slap", image: "lava-slap.png", price: 13, rarity: "rarity-blue" },
    { name: "Rainbow Slap", image: "rainbow-slap.png", price: 20, rarity: "rarity-purple" },
    { name: "Bloodmoon Slap", image: "bloodmoon-slap.png", price: 30, rarity: "rarity-purple" },
    { name: "Rainbow Hammer", image: "rainbow-hammer.png", price: 500, rarity: "rarity-red" },
    { name: "Bloodmoon Hammer", image: "bloodmoon-hammer.png", price: 1100, rarity: "rarity-red" }
];

const allItems = [
    { name: "1 Coin", image: "coin.png", price: 1, rarity: "rarity-blue" },
    { name: "Dragon Caneloni", image: "dragon-caneloni.png", price: 950, rarity: "rarity-gold" }
];

const cases = {
    sea: {
        name: "Морской кейс 🌊",
        image: "sea-case.png",
        price: 99,
        items: seaItems,
        roulette: "seaRoulette"
    },
    impact: {
        name: "Ударный кейс 👊",
        image: "impact-case.png",
        price: 12,
        items: impactItems,
        roulette: "impactRoulette"
    },
    all: {
        name: "ВСЁ ИЛИ НИЧЕГО 🎲",
        image: "all-or-nothing.png",
        price: 499,
        items: allItems,
        roulette: "allRoulette"
    }
};

let currentCase = "sea";

function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

function showHome() {
    document.getElementById("homePage").style.display = "block";
    document.getElementById("casePage").style.display = "none";

    document.getElementById("menu").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function showCase(caseId) {
    currentCase = caseId;
    const data = cases[caseId];

    document.getElementById("homePage").style.display = "none";
    document.getElementById("casePage").style.display = "block";

    document.getElementById("detailImage").src = data.image;
    document.getElementById("detailName").textContent = data.name;

    document.getElementById("detailPrice").innerHTML =
        data.price + ' <img class="coin-icon" src="coin.png" alt="coin">';

    document.querySelectorAll(".roulette-track").forEach(track => {
        track.classList.add("hidden");
    });

    document.getElementById(data.roulette).classList.remove("hidden");

    const grid = document.getElementById("itemsGrid");
    grid.innerHTML = "";

    data.items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card " + item.rarity;

        card.innerHTML = `
            <img src="${item.image}" alt="">
            <h4>${item.name}</h4>
            <div class="item-price">
                ${item.price.toLocaleString("ru-RU")}
                <img class="coin-icon" src="coin.png" alt="coin">
            </div>
        `;

        grid.appendChild(card);
    });
}

function openCase() {
    alert("Система открытия скоро появится!");
}

function showComingSoon(name) {
    alert(name + " скоро появится!");
}

/* Перемешивание массива */
function shuffleItems(items) {
    const shuffled = [...items];

    for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }

    return shuffled;
}

/* Создание случайной ленты рулетки */
function createRoulette(elementId, items) {
    const track = document.getElementById(elementId);

    let position = 0;
    let lastTime = null;

    const itemWidth = 112;
    const gap = 9;
    const step = itemWidth + gap;
    const speed = 65;

    function addItem(item) {
        const card = document.createElement("div");
        card.className = "roulette-item " + item.rarity;

        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.name;

        card.appendChild(img);
        track.appendChild(card);
    }

    /* Создаём несколько случайно перемешанных повторений */
    for (let i = 0; i < 8; i++) {
        const shuffled = shuffleItems(items);
        shuffled.forEach(item => addItem(item));
    }

    function animate(time) {
        if (lastTime === null) lastTime = time;

        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        position += speed * delta;

        while (position >= step) {
            track.appendChild(track.firstElementChild);
            position -= step;
        }

        track.style.transform = `translate3d(${-position}px, 0, 0)`;

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
}

createRoulette("seaRoulette", seaItems);
createRoulette("impactRoulette", impactItems);
createRoulette("allRoulette", allItems);

showHome();
</script>

</body>
</html>
