
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainRain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(ellipse at top left, #102C65 0%, transparent 45%),
                linear-gradient(135deg, #080D1B, #050918, #080D1B);
            font-family: Arial, sans-serif;
        }

        /* Логотип */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 85px;
            height: auto;
            object-fit: contain;
            z-index: 5;
        }

        /* Кнопка меню */
        .menu-button {
            position: absolute;
            top: 115px;
            left: 20px;
            width: 65px;
            height: 65px;
            border: none;
            border-radius: 13px;
            background: rgba(12, 25, 52, 0.65);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            z-index: 20;
        }

        .menu-button span {
            width: 30px;
            height: 3px;
            background: white;
            border-radius: 10px;
        }

        /* Выдвижное меню */
        .side-menu {
            position: absolute;
            top: 110px;
            left: 0;
            width: 50%;
            height: 65vh;
            min-height: 300px;
            background: linear-gradient(160deg, #10264D, #08152E);
            border-top: 1px solid rgba(255,255,255,0.4);
            border-right: 1px solid rgba(255,255,255,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.4);
            border-left: none;
            border-radius: 0 20px 20px 0;
            padding: 100px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            transform: translateX(-105%);
            transition: transform 0.35s ease;
            z-index: 10;
        }

        .side-menu.open {
            transform: translateX(0);
        }

        /* Надписи меню */
        .menu-item {
            color: white;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-decoration: none;
            padding: 9px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
        }

        .menu-item:active {
            background: rgba(75, 150, 255, 0.2);
        }
    </style>
</head>

<body>

    <img src="logo2.png" class="logo" alt="BrainRain">

    <button class="menu-button" id="menuButton">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="side-menu" id="sideMenu">
        <a class="menu-item" href="#">Upgrade</a>
        <a class="menu-item" href="#">Case</a>
        <a class="menu-item" href="#">Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const menuButton = document.getElementById("menuButton");
        const sideMenu = document.getElementById("sideMenu");

        menuButton.addEventListener("click", () => {
            sideMenu.classList.toggle("open");
        });
    </script>

</body>
</html>
